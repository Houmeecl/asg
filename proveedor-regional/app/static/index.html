function logMock(action,detail){mock.activity.unshift({action,detail,created_at:new Date().toISOString(),org_id:state.user.org_id})}
function mockRequest(path,opt={}){const u=new URL(path,'http://demo.local');const body=opt.body?JSON.parse(opt.body):{};const method=opt.method||'GET';if(u.pathname==='/api/health')return {mode:'demo',live_payments:false};if(u.pathname==='/api/login'){const user=mock.users.find(x=>x.email===body.email);if(!user||body.password!=='DemoRegional2026!')throw new Error('Correo o contraseña de demostración incorrectos.');state.user=user;return {user,csrf_token:'file-preview-only'}}if(!state.user)throw new Error('Inicia sesión para continuar.');const oid=Number(state.user.org_id),fund=isFoundation();const ownCompanies=fund?mock.companies:mock.companies.filter(c=>c.id===oid);const tasks=mock.tasks.filter(t=>t.org_id===oid);const acts=mock.activity.filter(a=>a.org_id===oid);switch(u.pathname){case '/api/me':return {user:state.user,csrf_token:'file-preview-only'};case '/api/logout':return {ok:true};case '/api/overview':return {org:{id:oid,name:state.user.org_name,kind:state.user.kind},stats:{companies:ownCompanies.length,passports:ownCompanies.length,tasks:tasks.length,pending_tasks:tasks.filter(t=>!done(t)).length},companies:ownCompanies,tasks,activity:acts};case '/api/companies':return {items:ownCompanies};case '/api/passport':{const c=ownCompanies.find(c=>c.id===Number(u.searchParams.get('company_id')))||ownCompanies[0];if(!c)throw new Error('No hay empresas disponibles.');return {company:c,passport:{id:'PR-ANT-DEMO-'+String(c.id).padStart(3,'0'),profile:c.profile,issued_at:'2026-10-26',expires_at:'2027-10-26',verification:'demo',requirements:[{label:'Identidad y representación',status:'complete',source:'Ejemplo documental ficticio'},{label:'Operación y arraigo regional',status:'complete',source:'Antecedente de demostración'},{label:'Propiedad y residencia',status:'pending',source:'Pendiente de revisión en este ejemplo'},{label:'Formación y capacidades',status:'pending',source:'Ruta de desarrollo ilustrativa'}]}}}case '/api/tasks':if(method==='POST'){const t={id:Date.now(),org_id:oid,title:body.title,due_date:body.due_date,status:'pending'};mock.tasks.push(t);logMock('Actividad creada',body.title);return t}return {items:tasks};case '/api/finance':{const target=Number(u.searchParams.get('org_id')||oid);const grant=mock.grants.find(g=>g.owner_org_id===target&&g.grantee_org_id===oid&&!g.revoked_at&&new Date(g.expires_at)>new Date());if(target!==oid&&(!fund||!grant)){const e=new Error('Esta empresa no ha autorizado la consulta de su información financiera. Sus cuentas permanecen separadas.');e.status=403;throw e}const user=mock.users.find(x=>x.org_id===target);return {org:{id:target,name:user.org_name},mode:'demo',accounts:[{currency:'CLP',balance:target===1?2850000:target===2?8240000:12650000,masked_number:'•••• '+(1400+target)},{currency:'USD',balance:target===1?1200:target===2?4250:6100,masked_number:'•••• '+(2400+target)},{currency:'EUR',balance:target===1?0:target===2?920:1500,masked_number:'•••• '+(3400+target)}],movements:[{id:1,date:'2026-10-25',description:'Ingreso ilustrativo del período',amount:target===1?550000:1850000,currency:'CLP',direction:'in',status:'simulated'},{id:2,date:'2026-10-24',description:'Compra de insumos · ejemplo',amount:target===1?125000:420000,currency:'CLP',direction:'out',status:'simulated'},{id:3,date:'2026-10-22',description:'Transferencia internacional · ejemplo',amount:280,currency:'USD',direction:'out',status:'simulated'}],connection:{configured:false,live_reads_enabled:false},drafts:target===oid?mock.drafts.filter(x=>x.org_id===target):[],notifications:target===oid?{items:mock.financialEvents.filter(x=>x.owner_org_id===oid),configured:false}:null}}case '/api/demo/financial-events':{if(method!=='POST')throw new Error('Método no disponible en esta vista previa.');if(!['paymentReceived','remittanceUpdate'].includes(body.event_type))throw new Error('Tipo de evento de demostración no válido.');const stamp=new Date().toISOString();const event={id:Date.now(),owner_org_id:oid,event_type:body.event_type,transaction_id:'DEMO-TRX-'+Date.now(),provider_status:body.event_type==='remittanceUpdate'?'sent':null,amount:body.event_type==='paymentReceived'?'125000':null,currency:body.event_type==='paymentReceived'?'CLP':null,received_at:stamp,transaction_created_at:stamp,state:'reported',source:'demo',issues:[]};mock.financialEvents.unshift(event);logMock('Notificación simulada',body.event_type+' · No modifica saldos ni confirma un pago real.');return event}case '/api/financial-events':return {items:mock.financialEvents.filter(x=>x.owner_org_id===oid),configured:false};case '/api/payment-drafts':{ const t={id:Date.now(),org_id:oid,beneficiary:body.beneficiary,amount:body.amount,currency:body.currency,status:'draft',created_at:new Date().toISOString()};mock.drafts.unshift(t);logMock('Borrador creado','Preparación interna; no se enviaron fondos.');return t}case '/api/finance/sync-read':throw new Error('La lectura real de Global66 no está habilitada en esta demostración.');case '/api/grants':if(method==='POST'){if(fund)throw new Error('La autorización debe otorgarla la empresa titular.');const g={id:Date.now(),owner_org_id:oid,owner_name:state.user.org_name,grantee_org_id:1,scope:'finance:read',expires_at:new Date(Date.now()+Number(body.duration_hours)*3600000).toISOString(),revoked_at:null,active:true};mock.grants.push(g);logMock('Permiso otorgado','Consulta financiera a Fundación Entretodos por '+body.duration_hours+' hora(s).');return g}return {items:mock.grants.filter(g=>g.owner_org_id===oid||g.grantee_org_id===oid).map(g=>({...g,active:!g.revoked_at&&new Date(g.expires_at)>new Date()})),can_grant:!fund};case '/api/activity':return {items:acts};default:if(u.pathname.match(/^\/api\/tasks\/\d+\/complete$/)){const id=Number(u.pathname.split('/')[3]),t=tasks.find(x=>x.id===id);if(!t)throw new Error('Actividad no encontrada.');t.status='done';logMock('Actividad completada',t.title);return t}if(u.pathname.match(/^\/api\/grants\/\d+\/revoke$/)){const id=Number(u.pathname.split('/')[3]),g=mock.grants.find(x=>x.id===id&&x.owner_org_id===oid);if(!g)throw new Error('No puedes revocar este permiso.');g.revoked_at=new Date().toISOString();g.active=false;logMock('Permiso revocado','La consulta futura queda deshabilitada.');return {ok:true}}throw new Error('Ruta no disponible en esta vista previa.')}}
async function api(path,opts={}){if(isFile){await new Promise(r=>setTimeout(r,100));return mockRequest(path,opts)}const headers={'Accept':'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.method&&opts.method!=='GET'&&state.csrf?{'X-CSRF-Token':state.csrf}:{}),...opts.headers};let r;try{r=await fetch(path,{...opts,headers,credentials:'same-origin'})}catch(e){throw new Error('No se pudo contactar al servidor. Comprueba que el portal esté iniciado.')}let data={};try{data=await r.json()}catch(e){}if(!r.ok){const e=new Error(typeof data.detail==='string'?data.detail:typeof data.message==='string'?data.message:'No fue posible completar la solicitud.');e.status=r.status;if(r.status===401&&path!=='/api/login'){state.user=null;renderLogin()}throw e}return data}
function toast(message){const box=document.getElementById('toast-root');box.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>box.innerHTML='',4500)}
function shell(){root.innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar">${brand()}<nav class="nav" aria-label="Navegación principal">${navs.map(([id,label,ic])=>`<button data-nav="${id}" class="${state.page===id?'active':''}">${icon(ic)}${esc(label)}</button>`).join('')}</nav><div class="sidebar-foot"><div class="side-note"><strong>Desarrollo desde el territorio</strong><span>Capacidades, evidencia y oportunidades para las empresas de nuestra región.</span></div><div class="side-foot-line">${icon('leaf',14)} Región de Antofagasta</div></div></aside><main class="main"><header class="topbar"><button class="icon-btn mobile-menu" data-action="menu" aria-label="Abrir navegación">${icon('menu')}</button><div class="breadcrumb">Programa Proveedor Regional <span>/ Portal de desarrollo</span></div><div class="top-right"><span class="date-label">${esc(new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'}))}</span><div class="identity"><div class="avatar">${esc((state.user.name||'PR').split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div><strong>${esc(state.user.org_name)}</strong><small>${isFoundation()?'Operación del programa':'Espacio de empresa'}</small></div></div><button class="icon-btn" data-action="logout" title="Salir de este espacio" aria-label="Cerrar sesión">${icon('logout',17)}</button></div></header><div class="demo-ribbon"><span><strong>DEMOSTRACIÓN</strong>Datos ficticios. No se conectan cuentas ni se ejecutan pagos reales.</span><span>${isFile?'Vista previa local, sin backend':'Entorno de prueba · cuentas separadas'}</span></div><div class="content" id="content"><div class="loading"><span class="spinner"></span>Cargando tu espacio…</div></div></main></div>`}
const footer=()=>`<footer class="footer"><span>Proveedor Regional · Programa de desarrollo de proveedores</span><span>Versión de prueba · Datos ilustrativos</span></footer>`;
function head(kicker,title,desc,button=''){return `<div class="page-head"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p class="subtitle">${esc(desc)}</p></div>${button}</div>`}
function errorHTML(e,action=''){return `<div class="notice ${e.status===403?'warning':'error'}">${icon(e.status===403?'lock':'info',20)}<div><strong>${e.status===403?'Acceso no autorizado':'No se pudo completar la consulta'}</strong><br>${esc(e.message)}${action?'<div style="margin-top:12px">'+action+'</div>':''}</div></div>`}
const companyRow=c=>`<div class="company-row"><div class="company-icon">${icon('building',18)}</div><div class="row-main"><strong>${esc(c.name)}</strong><small>${esc(c.commune)} · ${esc(c.region)}</small></div>${profileBadge(c.profile)}<button class="icon-btn" data-passport="${esc(c.id)}" aria-label="Ver Pasaporte de ${esc(c.name)}">${icon('arrow',15)}</button></div>`;
const taskRow=t=>`<div class="task-row"><span class="task-dot" style="${done(t)?'background:#abcbb9':''}"></span><div class="row-main"><strong>${esc(t.title)}</strong><small>${done(t)?'Completada':'Pendiente de gestión'}</small></div><span class="task-date">${esc(fmtDate(t.due_date))}</span>${!done(t)?`<button class="btn small" data-complete="${esc(t.id)}" aria-label="Completar ${esc(t.title)}">${icon('check',12)}</button>`:''}</div>`;
const empty=(title,desc)=>`<div class="empty">${icon('file',30)}<h3>${esc(title)}</h3><p>${esc(desc)}</p></div>`;
async function navigate(page,options={}){state.page=page;const rid=++state.requestId;if(!state.user)return renderLogin();shell();const content=document.getElementById('content');try{let html='';if(page==='overview')html=await overview();else if(page==='companies')html=await companies();else if(page==='passport')html=await passport(options.companyId);else if(page==='tasks')html=await tasks();else if(page==='finance')html=await finance();else if(page==='grants')html=await grants();if(rid===state.requestId&&document.getElementById('content'))content.innerHTML=html+footer()}catch(e){if(rid===state.requestId&&state.user)content.innerHTML=head('Tu espacio','Información disponible','Cada organización conserva sus datos y permisos.')+errorHTML(e,`<button class="btn" data-nav="${esc(page)}">Volver a intentar</button>`)+footer()}}
async function overview(){const d=await api('/api/overview');state.companies=d.companies||[];const s=d.stats||{};return head('Panel del programa',isFoundation()?'Un territorio. Muchas oportunidades.':'Tu ruta de desarrollo, en un lugar.',isFoundation()?'Acompaña a las empresas, organiza sus evidencias y sigue cada compromiso.':'Revisa tus antecedentes, actividades y permisos desde tu propio espacio.',`<button class="btn primary" data-action="new-task">${icon('plus',15)} Nueva actividad</button>`)+`<section class="hero"><div class="hero-copy"><div class="eyebrow">Programa Proveedor Regional</div><h2>Conectamos capacidades.<br>Impulsamos desarrollo local.</h2><p>Una ruta de acompañamiento para hacer visibles las capacidades de las empresas y fortalecer sus vínculos con el territorio.</p><div class="hero-tags"><span>Identidad y evidencia</span><span>Desarrollo empresarial</span><span>Arraigo regional</span></div></div>${landscape()}</section><div class="stats">${[['Empresas en tu espacio',s.companies||0,'building','Registro de demostración'],['Pasaportes registrados',s.passports||0,'passport','Ejemplos sin validez de acreditación'],['Actividades programadas',s.tasks||0,'calendar','Agenda de tu organización'],['Compromisos pendientes',s.pending_tasks||0,'clock','Seguimiento de actividades']].map(([label,val,ic,caption])=>`<article class="stat"><div class="stat-top"><span class="stat-label">${label}</span><span class="stat-icon">${icon(ic,16)}</span></div><div class="stat-value">${esc(val)}</div><div class="stat-caption">${caption}</div></article>`).join('')}</div><div class="grid-two"><section class="card"><div class="card-head"><div><h2>${isFoundation()?'Empresas del programa':'Mi empresa'}</h2><p>Capacidades y perfiles de desarrollo.</p></div><button class="btn small ghost" data-nav="companies">Ver registro ${icon('arrow',12)}</button></div><div class="card-body">${state.companies.length?state.companies.slice(0,4).map(companyRow).join(''):empty('Todavía no hay empresas','El registro aparecerá aquí.')}</div></section><section class="card"><div class="card-head"><div><h2>Próximos compromisos</h2><p>Un siguiente paso para cada objetivo.</p></div>${icon('calendar',18)}</div><div class="card-body">${(d.tasks||[]).length?d.tasks.slice(0,4).map(taskRow).join(''):empty('Agenda despejada','Crea una actividad para comenzar.')}</div></section></div><div class="notice">${icon('shield',19)}<div><strong>Cada cuenta tiene su propio espacio.</strong> La fundación puede acompañar a las empresas sin acceder a sus finanzas. Una empresa debe autorizar expresamente cualquier consulta financiera.</div></div>`}
async function companies(){const d=await api('/api/companies');state.companies=d.items||[];return head('Registro territorial',isFoundation()?'Empresas que construyen región':'Información de mi empresa','Datos y perfiles ilustrativos; una inscripción no equivale a homologación.')+`<div class="filters"><label class="sr-only" for="company-search">Buscar empresa o comuna</label><input class="input search" id="company-search" placeholder="Buscar empresa o comuna…" type="search"><span class="badge gray">${state.companies.length} registro(s)</span></div><section class="card"><div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Territorio</th><th>Ventas anuales</th><th>Perfil</th><th>Pasaporte</th></tr></thead><tbody id="company-body">${companyTableRows(state.companies)}</tbody></table></div><div class="table-footer">Información ficticia para probar el programa · Tramo de ventas y perfil son dimensiones distintas.</div></section>`}
function companyTableRows(list){return list.length?list.map(c=>`<tr><td><strong>${esc(c.name)}</strong><small>${esc(c.rut)} · Registro de prueba</small></td><td>${esc(c.commune)}<small>${esc(c.region)}</small></td><td>${esc(new Intl.NumberFormat('es-CL').format(c.sales_uf||0))} UF<small>Dato de demostración</small></td><td>${profileBadge(c.profile)}</td><td><button class="btn small" data-passport="${esc(c.id)}">Ver ficha ${icon('arrow',12)}</button></td></tr>`).join(''):`<tr><td colspan="5">${empty('Sin coincidencias','Prueba otra empresa o comuna.')}</td></tr>`}
async function passport(companyId){if(!state.companies.length){const c=await api('/api/companies');state.companies=c.items||[]}const id=companyId||state.companies[0]?.id;if(!id)return head('Evidencia empresarial','Pasaporte Regional','Tu ficha, tus capacidades y su procedencia.')+empty('No hay una ficha disponible','Primero debe existir una empresa en tu espacio.');const d=await api('/api/passport?company_id='+encodeURIComponent(id));const c=d.company,p=d.passport;return head('Evidencia y capacidades','Pasaporte Regional','Una ficha del programa; no es una certificación ISO ni una homologación comercial.')+`<div class="filters"><label class="sr-only" for="passport-company">Empresa</label><select id="passport-company" class="input org-select">${state.companies.map(x=>`<option value="${esc(x.id)}" ${Number(x.id)===Number(c.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="passport"><section class="passport-face"><div class="eyebrow">Programa Proveedor Regional</div>${icon('passport',33)}<h2>${esc(c.name)}</h2><p>${esc(c.commune)} · ${esc(c.region)}</p>${profileBadge(p.profile||c.profile)}<div class="passport-id">${esc(p.id)}</div><div class="passport-bottom"><span>Emisión ilustrativa<br>${esc(fmtDate(p.issued_at))}</span><span>Revisión prevista<br>${esc(fmtDate(p.expires_at))}</span></div><div style="margin-top:23px;font-size:9px;color:#d8bd87">FICHA DE DEMOSTRACIÓN · SIN VALIDEZ DE ACREDITACIÓN</div></section><section class="card"><div class="card-head"><div><h2>Antecedentes del expediente</h2><p>Estado y fuente de cada requisito.</p></div><span class="badge gold">Simulación</span></div><div class="card-body requirements">${(p.requirements||[]).map(r=>{const ok=['complete','completed','verified','comprobado','ok','ejemplo completo'].includes(String(r.status).toLowerCase());return `<div class="requirement"><div><strong>${esc(r.label)}</strong><small>${esc(r.source||'Sin fuente registrada')}</small></div><span class="badge ${ok?'teal':'gold'}">${ok?'Ejemplo revisado':'Pendiente'}</span></div>`}).join('')||empty('Sin requisitos cargados','Los estados aparecerán al organizar la evidencia.')}<div class="notice warning" style="margin-top:20px">${icon('info',18)}<div>Los documentos y verificaciones de esta ficha son ficticios. Ninguna identidad ha sido validada por Global66 o por un registro oficial.</div></div></div></section></div>`}
async function tasks(){const d=await api('/api/tasks');const all=d.items||[];return head('Acompañamiento continuo','Agenda y compromisos','Organiza próximos pasos y conserva evidencia de avance.',`<button class="btn primary" data-action="new-task">${icon('plus',15)} Nueva actividad</button>`)+`<section class="card"><div class="card-head"><div><h2>Actividades de ${esc(state.user.org_name)}</h2><p>${all.filter(t=>!done(t)).length} pendiente(s) · ${all.filter(done).length} completada(s)</p></div><span class="badge gray">Agenda propia</span></div><div class="card-body">${all.length?all.map(taskRow).join(''):empty('Tu agenda comienza aquí','Crea una actividad con título y fecha.')}</div></section>`}
function financeSelector(){if(!isFoundation())return '';return `<div class="filters"><label class="mini-label" for="finance-org">Espacio financiero</label><select class="input org-select" id="finance-org"><option value="${esc(state.user.org_id)}" ${Number(state.financeOrg||state.user.org_id)===Number(state.user.org_id)?'selected':''}>Fundación · operación propia</option>${state.companies.map(c=>`<option value="${esc(c.id)}" ${Number(state.financeOrg)===Number(c.id)?'selected':''}>${esc(c.name)} · empresa</option>`).join('')}</select></div>`}
async function finance(){if(isFoundation()&&!state.companies.length){const cs=await api('/api/companies');state.companies=cs.items||[]}const target=state.financeOrg||state.user.org_id;let d;try{d=await api('/api/finance?org_id='+encodeURIComponent(target))}catch(e){return head('Operación financiera','Cuentas y movimientos','Información separada por titular; las empresas controlan sus permisos.')+financeSelector()+errorHTML(e,`<button class="btn" data-nav="grants">Ver permisos de consulta</button>`)}const own=Number(d.org.id)===Number(state.user.org_id),conn=d.connection||{};return head('Operación financiera','Cuentas y movimientos','Saldos y movimientos simulados. No se ejecutan transferencias reales.',own?`<button class="btn primary" data-action="new-draft">${icon('plus',15)} Preparar borrador</button>`:'')+financeSelector()+`<section class="card"><div class="card-head split"><div class="connection"><div class="connection-mark">G</div><div><strong>Integración Global66</strong><small>${conn.configured?'Configuración disponible en servidor':'Pendiente de configurar en el servidor'} · ${esc(d.org.name)}</small></div></div><div class="tag-row"><span class="badge ${conn.live_reads_enabled?'teal':'gray'}">${conn.live_reads_enabled?'Lectura habilitada':'Datos simulados'}</span>${own?`<button class="btn small" data-action="sync-read">${icon('refresh',13)} Consultar conexión</button>`:''}</div></div></section>${!own?`<div class="notice section-space">${icon('shield',18)}<div>Consulta autorizada por la empresa. <strong>Solo lectura</strong>: este permiso no permite transferir fondos ni administrar su cuenta.</div></div>`:''}<div class="finance-cards">${(d.accounts||[]).map(a=>`<div class="balance-card"><div class="currency"><span>${esc(a.currency)} · Saldo simulado</span>${icon('wallet',16)}</div><div class="amount">${esc(fmtMoney(a.balance,a.currency))}</div><small>Cuenta ${esc(a.masked_number||'••••')} · Ejemplo de demostración</small></div>`).join('')}</div><section class="card"><div class="card-head"><div><h2>Movimientos simulados</h2><p>Ejemplos para probar seguimiento y conciliación.</p></div><span class="badge gold">Demostración</span></div><div class="table-wrap"><table><thead><tr><th>Descripción</th><th>Fecha</th><th>Monto</th><th>Estado</th></tr></thead><tbody>${(d.movements||[]).map(m=>{const income=['in','income','credit','incoming','inbound'].includes(String(m.direction).toLowerCase()),outgoing=['out','expense','debit','outgoing','outbound'].includes(String(m.direction).toLowerCase());return `<tr><td><strong>${esc(m.description)}</strong><small>Referencia ${esc(m.id)}</small></td><td>${esc(fmtDate(m.date))}</td><td class="${income?'amount-in':'amount-out'}">${income?'+':outgoing?'−':''} ${esc(fmtMoney(m.amount===null?null:Math.abs(Number(m.amount)),m.currency))}${!income&&!outgoing?'<small>Dirección no informada</small>':''}</td><td><span class="badge gray">Simulado</span></td></tr>`}).join('')||`<tr><td colspan="4">${empty('Sin movimientos','No hay información disponible en este espacio.')}</td></tr>`}</tbody></table></div></section><section class="card section-space"><div class="card-head"><div><h2>Borradores de pago</h2><p>Preparación interna. No son órdenes enviadas a Global66.</p></div>${icon('file',18)}</div><div class="table-wrap"><table><thead><tr><th>Destinatario</th><th>Monto</th><th>Creación</th><th>Estado</th></tr></thead><tbody>${(d.drafts||[]).map(p=>`<tr><td><strong>${esc(p.beneficiary)}</strong></td><td>${esc(fmtMoney(p.amount,p.currency))}</td><td>${esc(fmtDate(p.created_at))}</td><td><span class="badge gold">Borrador no enviado</span></td></tr>`).join('')||`<tr><td colspan="4">${empty('Sin borradores preparados','No hay pagos enviados ni pendientes de ejecución.')}</td></tr>`}</tbody></table></div></section>${own?financialEventsPanel(d.notifications,d.mode):''}<div class="notice warning section-space">${icon('lock',18)}<div>Las claves de Global66 se configuran únicamente en el servidor. Este portal no solicita contraseñas bancarias y no guarda credenciales en el navegador.</div></div>`}

function financialEventsPanel(notifications,mode){
 const n=notifications&&typeof notifications==='object'?notifications:{items:[],configured:false};
 const items=Array.isArray(n.items)?n.items:[];
 const eventTypes={paymentReceived:'Aviso de recepción',remittanceUpdate:'Estado de remesa',unknown:'Evento no reconocido'};
 const eventDate=v=>v?esc(fmtDate(v))+'<small>'+esc(new Date(v).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))+'</small>':'No informado';
 const value=v=>v===null||v===undefined||v===''?'No informado':esc(v);
 const amount=e=>e.amount===null||e.amount===undefined||e.amount===''||!Number.isFinite(Number(e.amount))?'No informado':e.currency?esc(fmtMoney(e.amount,e.currency)):esc(new Intl.NumberFormat('es-CL',{maximumFractionDigits:8}).format(Number(e.amount)))+'<small>Moneda no informada</small>';
 return `<section class="card section-space" id="financial-events"><div class="card-head split"><div><h2>Notificaciones de Global66</h2><p>Eventos recibidos por este espacio, separados de saldos y movimientos.</p></div><span class="badge gray">Solo titular</span></div><div class="card-body"><div class="notice">${icon('info',18)}<div>Una notificación informa un evento: <strong>no modifica el saldo ni confirma por sí sola un pago</strong>. Los avisos solo están disponibles para la organización titular, incluso si autoriza a la fundación a consultar saldos y movimientos.</div></div>${mode==='demo'?`<div class="split section-space"><p class="muted" style="font-size:10px">Prueba el flujo con datos ficticios.<br>Los botones no contactan a Global66 ni cambian los saldos.</p><div class="tag-row"><button class="btn small" data-sim-event="paymentReceived">${icon('plus',12)} Simular recepción</button><button class="btn small" data-sim-event="remittanceUpdate">${icon('refresh',12)} Simular estado de remesa</button></div></div>`:`<p class="subtitle">${n.configured?'Validación del receptor configurada en el servidor.':'Receptor pendiente de configuración en el servidor.'}</p>`}</div><div class="table-wrap"><table><thead><tr><th>Tipo y fuente</th><th>Transacción</th><th>Monto de origen</th><th>Estado informado</th><th>Fecha de recepción</th></tr></thead><tbody>${items.map(e=>`<tr><td><strong>${esc(eventTypes[e.event_type]||'Evento no reconocido')}</strong><small><span class="badge ${e.source==='demo'?'gold':'gray'}">${e.source==='demo'?'Simulación':e.source==='global66'?'Global66':'Fuente no informada'}</span></small></td><td style="max-width:170px;overflow-wrap:anywhere">${value(e.transaction_id)}</td><td>${amount(e)}</td><td><strong>${value(e.provider_status)}</strong><small>${e.state==='needs_review'?'Requiere revisión':e.state==='reported'?'Aviso recibido':'Estado de revisión no informado'}</small></td><td>${eventDate(e.received_at)}</td></tr>`).join('')||`<tr><td colspan="5">${empty('Sin notificaciones registradas',mode==='demo'?'Simula un evento para ver cómo se presenta sin alterar tus saldos.':'Los eventos aparecerán cuando el receptor esté configurado y reciba avisos.')}</td></tr>`}</tbody></table></div><div class="table-footer">No se muestran datos personales del remitente ni números de cuenta. El estado informado procede del evento y debe revisarse con los antecedentes de la operación.</div></section>`;
}

async function grants(){const [d,a]=await Promise.all([api('/api/grants'),api('/api/activity')]);const items=d.items||[];return head('Confianza y control','Permisos y actividad','Cada autorización tiene un alcance concreto, una duración y un registro.')+(d.can_grant?`<section class="permission-card"><div class="split"><div><h2>Compartir una consulta financiera</h2><p class="subtitle">La empresa titular decide qué puede consultar el programa.</p></div><span class="badge gray">Solo lectura</span></div><div class="permission-facts"><div><span>Quién autoriza</span><strong>${esc(state.user.org_name)}</strong></div><div><span>Quién recibe acceso</span><strong>Fundación Entretodos · equipo del programa</strong></div><div><span>Información</span><strong>Saldos y movimientos de esta empresa</strong></div><div><span>Fuera del permiso</span><strong>Transferir, retirar o administrar fondos</strong></div></div><fieldset style="border:0;padding:0;margin:0"><legend class="mini-label">Duración del permiso</legend><div class="radio-options"><label class="radio-card"><input type="radio" name="duration" value="1" checked><span><strong>Por una hora</strong><small>Acceso temporal para una revisión puntual.</small></span></label><label class="radio-card"><input type="radio" name="duration" value="24"><span><strong>Por 24 horas</strong><small>Finaliza automáticamente al vencer.</small></span></label></div></fieldset><div class="split"><p class="muted" style="font-size:10px">Puedes revocarlo en cualquier momento.<br>La autorización no conecta una cuenta real en esta demostración.</p><button class="btn primary" data-action="grant">${icon('shield',14)} Autorizar consulta temporal</button></div></section>`:`<div class="notice section-space" style="margin:0 0 20px">${icon('shield',18)}<div><strong>La autorización la otorga cada empresa.</strong> La fundación consulta únicamente cuando existe un permiso activo. No puede concederse acceso a sí misma ni mover fondos de una empresa.</div></div>`)+`<section class="card"><div class="card-head"><div><h2>Autorizaciones registradas</h2><p>El vencimiento y la revocación detienen consultas futuras.</p></div><span class="badge gray">${items.filter(g=>g.active&&!g.revoked_at).length} activa(s)</span></div><div class="table-wrap"><table><thead><tr><th>Empresa titular</th><th>Alcance</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead><tbody>${items.map(g=>`<tr><td><strong>${esc(g.owner_name||'Empresa '+g.owner_org_id)}</strong><small>Destinatario: Fundación Entretodos</small></td><td>Consulta financiera<small>Sin transferencias</small></td><td>${esc(fmtDate(g.expires_at))}<small>${esc(new Date(g.expires_at).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}))}</small></td><td><span class="badge ${g.active&&!g.revoked_at?'teal':'gray'}">${g.revoked_at?'Revocado':g.active?'Activo':'Vencido'}</span></td><td>${d.can_grant&&Number(g.owner_org_id)===Number(state.user.org_id)&&g.active&&!g.revoked_at?`<button class="btn small danger" data-revoke="${esc(g.id)}">Revocar ahora</button>`:''}</td></tr>`).join('')||`<tr><td colspan="5">${empty('Todavía no hay permisos','Las finanzas permanecen privadas por defecto.')}</td></tr>`}</tbody></table></div></section><section class="card section-space"><div class="card-head"><div><h2>Registro de actividad</h2><p>Qué ocurrió, cuándo y dentro de qué espacio.</p></div>${icon('clock',18)}</div><div class="card-body">${(a.items||[]).length?a.items.slice(0,20).map(x=>`<div class="activity-row"><span class="dot"></span><div><strong>${esc(x.action)}</strong><span>${esc(x.detail)}</span></div><time>${esc(fmtDate(x.created_at))}</time></div>`).join(''):empty('Sin actividad registrada','Los cambios de tareas, borradores y permisos aparecerán aquí.')}</div></section>`}
function renderLogin(){state.user=null;root.innerHTML=`<main class="login"><section class="login-story">${brand()}<div class="eyebrow" style="margin-top:90px;color:#d1b477">Capacidades que hacen región</div><h1 style="margin-top:10px">El desarrollo<br>empieza aquí.</h1><p>Un espacio para acompañar empresas, organizar evidencia y conectar las oportunidades del territorio.</p>${landscape()}</section><section class="login-content"><div class="login-box"><div class="eyebrow">Portal del programa</div><h1>Bienvenido a tu espacio</h1><p class="subtitle">Fundación y empresas acceden por separado.<br>Esta versión utiliza únicamente datos ficticios.</p><form id="login-form"><div class="field"><label for="login-email">Correo de acceso</label><input id="login-email" class="input" type="email" autocomplete="username" value="fundacion@demo.local" required></div><div class="field"><label for="login-password">Contraseña de demostración</label><input id="login-password" class="input" type="password" autocomplete="current-password" value="DemoRegional2026!" required></div><p id="login-error" class="form-error" role="alert"></p><button class="btn primary" style="width:100%" type="submit">Entrar al portal ${icon('arrow',15)}</button></form><div class="demo-users"><p>Explora la demostración con una de estas cuentas:</p><div class="quick-users">${mock.users.map(u=>`<button class="btn" data-quick-login="${esc(u.email)}"><span>${u.kind==='foundation'?'Fundación · operación del programa':esc(u.org_name)}</span>${icon('arrow',13)}</button>`).join('')}</div><p style="margin:12px 0 0">Clave de prueba: <strong>DemoRegional2026!</strong></p></div><p class="login-fine">${isFile?'Vista previa local, sin backend. El acceso es una simulación y los datos se reinician al cerrar.':'Entorno de demostración. Estas cuentas no deben utilizarse en producción.'}</p></div></section></main>`;document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();login(document.getElementById('login-email').value,document.getElementById('login-password').value)})}
async function login(email,password){const button=document.querySelector('#login-form button[type=submit]');if(button)button.disabled=true;try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email,password})});state.user=d.user;state.csrf=d.csrf_token;state.financeOrg=null;state.companies=[];await navigate('overview')}catch(e){const t=document.getElementById('login-error');if(t)t.textContent=e.message;else toast(e.message)}finally{if(button)button.disabled=false}}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.removeEventListener('keydown',modalKeys);if(closeModal.returnFocus?.isConnected)closeModal.returnFocus.focus()}
function modalKeys(e){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const el=document.querySelector('.modal');if(!el)return;const fields=[...el.querySelectorAll('button,input,select,[tabindex="0"]')].filter(x=>!x.disabled);if(!fields.length)return;const first=fields[0],last=fields[fields.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
function modal(type){closeModal.returnFocus=document.activeElement;const draft=type==='draft';document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${draft?'Preparar un borrador de pago':'Nueva actividad'}</h2><p class="subtitle">${draft?'Solo organiza una intención de pago; no envía dinero.':'El compromiso se guarda en el espacio de tu organización.'}</p><form id="modal-form">${draft?`<div class="notice warning" style="margin-bottom:18px">${icon('info',17)}<span>No se crea una orden en Global66 ni se consulta una cotización real.</span></div><div class="field"><label for="beneficiary">Destinatario de ejemplo</label><input class="input" id="beneficiary" required maxlength="120" placeholder="Ej. Proveedor de insumos"></div><div style="display:grid;grid-template-columns:1fr 100px;gap:12px"><div class="field"><label for="draft-amount">Monto</label><input class="input" id="draft-amount" type="number" min="0.01" step="0.01" max="999999999" required placeholder="0,00"></div><div class="field"><label for="draft-currency">Moneda</label><select class="input" id="draft-currency"><option>CLP</option><option>USD</option><option>EUR</option></select></div></div>`:`<div class="field"><label for="task-title">Actividad</label><input class="input" id="task-title" maxlength="160" required placeholder="Ej. Revisar carpeta de antecedentes"></div><div class="field"><label for="task-due">Fecha prevista</label><input class="input" id="task-due" type="date" required value="${new Date().toISOString().slice(0,10)}"></div>`}<p class="form-error" id="modal-error" role="alert"></p><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button type="submit" class="btn primary">${draft?'Guardar borrador sin enviar':'Crear actividad'}</button></div></form></section></div>`;document.addEventListener('keydown',modalKeys);document.querySelector('[data-action="close-modal"]').focus();document.getElementById('modal-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{if(draft){const beneficiary=document.getElementById('beneficiary').value.trim(),amount=document.getElementById('draft-amount').value,currency=document.getElementById('draft-currency').value;if(!beneficiary||!(Number(amount)>0))throw new Error('Completa destinatario y un monto mayor que cero.');await api('/api/payment-drafts',{method:'POST',body:JSON.stringify({beneficiary,amount,currency})})}else{const title=document.getElementById('task-title').value.trim(),due_date=document.getElementById('task-due').value;if(!title||!due_date)throw new Error('Completa el título y la fecha.');await api('/api/tasks',{method:'POST',body:JSON.stringify({title,due_date})})}closeModal();toast(draft?'Borrador guardado. No se enviaron fondos.':'Actividad creada en tu espacio.');await navigate(draft?'finance':'tasks')}catch(err){document.getElementById('modal-error').textContent=err.message;b.disabled=false}})}

function showSnapshot(s){closeModal.returnFocus=document.activeElement;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">Consulta de solo lectura</h2><p class="subtitle">Resultado de Global66 · ${esc(fmtDate(s.as_of))}</p><div class="notice">${icon('shield',18)}<div>Esta consulta no ejecuta pagos ni modifica los registros locales. Fuente: ${esc(s.source||'Global66')}.</div></div>${s.partial?'<div class="notice warning section-space">La respuesta es parcial; algunas cuentas o movimientos podrían no estar disponibles.</div>':''}<div class="section-space">${(s.accounts||[]).map(a=>`<div class="requirement"><div><strong>${esc(a.alias||a.currency)}</strong><small>${esc(a.currency)} · Cuenta ${esc(a.id)}</small></div><strong>${esc(fmtMoney(a.balance,a.currency))}</strong></div>`).join('')||'<p class="muted">Sin cuentas en la respuesta.</p>'}</div><p class="subtitle">${esc((s.movements||[]).length)} movimiento(s) recibidos en esta consulta.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cerrar consulta</button></div></section></div>`;document.addEventListener('keydown',modalKeys);document.querySelector('[data-action="close-modal"]').focus()}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.passport){navigate('passport',{companyId:b.dataset.passport});return}if(b.dataset.quickLogin){login(b.dataset.quickLogin,'DemoRegional2026!');return}if(b.dataset.simEvent){b.disabled=true;try{await api('/api/demo/financial-events',{method:'POST',body:JSON.stringify({event_type:b.dataset.simEvent})});toast('Notificación ficticia registrada. Los saldos no cambian.');await navigate('finance');document.getElementById('financial-events')?.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(err){toast(err.message);b.disabled=false}return}if(b.dataset.complete){b.disabled=true;try{await api('/api/tasks/'+encodeURIComponent(b.dataset.complete)+'/complete',{method:'POST'});toast('Actividad completada.');navigate(state.page)}catch(err){toast(err.message);b.disabled=false}return}if(b.dataset.revoke){b.disabled=true;try{await api('/api/grants/'+encodeURIComponent(b.dataset.revoke)+'/revoke',{method:'POST'});toast('Permiso revocado. Las próximas consultas quedan bloqueadas.');navigate('grants')}catch(err){toast(err.message);b.disabled=false}return}const a=b.dataset.action;if(a==='menu')document.getElementById('sidebar')?.classList.toggle('open');if(a==='new-task')modal('task');if(a==='new-draft')modal('draft');if(a==='close-modal')closeModal();if(a==='logout'){try{await api('/api/logout',{method:'POST'})}catch(err){toast('No se pudo cerrar la sesión: '+err.message);return}state.user=null;state.csrf=null;state.financeOrg=null;state.companies=[];state.requestId++;renderLogin()}if(a==='sync-read'){b.disabled=true;try{const snapshot=await api('/api/finance/sync-read',{method:'POST'});showSnapshot(snapshot);b.disabled=false}catch(err){toast(err.message);b.disabled=false}}if(a==='grant'){const hours=Number(document.querySelector('input[name="duration"]:checked')?.value||1);b.disabled=true;try{await api('/api/grants',{method:'POST',body:JSON.stringify({duration_hours:hours})});toast('Consulta financiera autorizada durante '+hours+' hora(s).');navigate('grants')}catch(err){toast(err.message);b.disabled=false}}});
document.addEventListener('change',e=>{if(e.target.id==='passport-company')navigate('passport',{companyId:e.target.value});if(e.target.id==='finance-org'){state.financeOrg=Number(e.target.value);navigate('finance')}});
document.addEventListener('input',e=>{if(e.target.id==='company-search'){const q=e.target.value.toLocaleLowerCase('es');document.getElementById('company-body').innerHTML=companyTableRows(state.companies.filter(c=>(c.name+' '+c.commune).toLocaleLowerCase('es').includes(q)))}});
(async()=>{if(isFile){state.user=mock.users[0];state.csrf='file-preview-only';await navigate('overview');return}try{const d=await api('/api/me');state.user=d.user;state.csrf=d.csrf_token;await navigate('overview')}catch(e){renderLogin()}})();
</script>
</body></html>
