name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch a desplegar'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          REMOTE_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          REMOTE_BRANCH: ${{ github.event.inputs.branch }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: REMOTE_APP_DIR,REMOTE_BRANCH
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            APP_DIR="${REMOTE_APP_DIR:-/var/www/sicr3p}"
            BRANCH="${REMOTE_BRANCH:-main}"
            cd "$APP_DIR"
            test -f package.json
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm ci
            npm run build
            npm prune --omit=dev
            if pm2 describe sicr3p >/dev/null 2>&1; then
              pm2 restart sicr3p --update-env
            else
              mkdir -p logs data
              pm2 start npm --name sicr3p -- start
              pm2 save
            fi
            PORT=$(grep -E '^PORT=' .env 2>/dev/null | cut -d= -f2 || true)
            PORT=${PORT:-3000}
            for attempt in $(seq 1 15); do
              if curl -fsS "http://127.0.0.1:$PORT/api/health" >/dev/null; then
                echo "Deployment healthy: $(git rev-parse --short HEAD)"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed" >&2
            pm2 logs sicr3p --lines 40 --nostream || true
            exit 1
